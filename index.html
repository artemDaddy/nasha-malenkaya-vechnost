  <style>

    @media(min-width:650px){.viewport{padding-left:42px;padding-right:42px}.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}.memory .portrait{min-height:190px}.hero{min-height:72svh}.bottom-nav{padding-left:max(24px,calc((100vw - 860px)/2));padding-right:max(24px,calc((100vw - 860px)/2))}}
    @media(max-width:360px){.viewport{padding-left:17px;padding-right:17px}.topbar{padding-left:13px;padding-right:13px}.brand{font-size:.68rem}.button{padding-left:16px;padding-right:16px}.nav-center{font-size:.7rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<div class="app">
  <header class="topbar" id="topbar" hidden><div class="brand">для нас двоих</div><div class="progress" aria-label="Прогресс путешествия"><i id="progressBar"></i></div><div class="progress-label" id="progressLabel">1 / 8</div></header>
  <main class="viewport" id="viewport" aria-live="polite"></main>
  <nav class="bottom-nav" id="bottomNav" hidden aria-label="Навигация путешествия">
    <button class="button icon" id="prevButton" aria-label="Предыдущая глава" title="Назад">←</button>
    <div class="nav-center"><button id="chaptersButton">Оглавление</button></div>
    <button class="button icon" id="nextButton" aria-label="Следующая глава" title="Дальше">→</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
// НАСТРОЙКИ ПОДАРКА — заменяйте тексты и данные только в этом блоке.
// Фотографии кладите в соседнюю папку images; пустой путь показывает красивую заглушку.

  главы: ["С чего всё началось", "Моменты, которые хочется сохранить", "наши приколы", "То, что я люблю в тебе", "Два года — и это только начало", "Маленький интерактивчик для нас двоих", "Письмо для тебя", "И это ещё не конец"],
  начало: {
    история: "это был день нашего города - Астрахани) 8 сентября - тот самый день, когда ты вдруг решила отправить мне кружочек. Для меня, признаюсь честно, это тоже было чем то очень неожиданным, но в глубине души я радовался, потому что ты мне уже нравилась. Но я думал, что все это случайность, пока ты «случайно» не отправила мне кружок типо для Маши, но не удаляла его. Тогда я понял, что это начало чего то большого❤️",
    фото: "a8dc90e9-9dd1-4f63-8547-68c7859f0e51.jpg", // Первая фотография; замените путь или оставьте пустым.
    подпись: "9 сентября, 2024 год",
    переписка: [
      {кто:"Света", дата:"[дата или контекст]", текст:"[Вставьте её настоящее сообщение — или удалите этот пример.]"},

    отклик: "[Добавьте фразу, которая появится после нажатия. Например: что вы чувствовали в тот день.]"
  },
  воспоминания: [
    {заголовок:"[Момент, который хочется сохранить]", дата:"[дата или место]", фото:"images/photo-02.jpg", подпись:"[Короткая подпись к снимку]", история:"[Расскажите, что происходило и почему вы возвращаетесь к этому воспоминанию.]"},
    {заголовок:"[Наш обычный, но особенный день]", дата:"[дата или место]", фото:"images/photo-03.jpg", подпись:"[Ваша подпись]", история:"[Ваша история — можно написать всего пару искренних предложений.]"},
    {заголовок:"[День, который стал нашим]", дата:"[дата или место]", фото:"images/photo-04.jpg", подпись:"[Ваша подпись]", история:"[Замените заглушку своим воспоминанием.]"},
    {заголовок:"[Ещё одна наша история]", дата:"[дата или место]", фото:"images/photo-05.jpg", подпись:"[Ваша подпись]", история:"[Замените заглушку своим воспоминанием.]"},
    {заголовок:"[Маленькое большое счастье]", дата:"[дата или место]", фото:"images/photo-06.jpg", подпись:"[Ваша подпись]", история:"[Замените заглушку своим воспоминанием.]"},
    {заголовок:"[И это тоже — про нас]", дата:"[дата или место]", фото:"images/photo-07.jpg", подпись:"[Ваша подпись]", история:"[Замените заглушку своим воспоминанием.]"}
  ],
  приколы: [
    {заголовок:"[Наша фраза]", цитата:"[Внутренняя шутка или строка переписки]", продолжение:"[Почему нам смешно каждый раз? Добавьте подробности и, если хотите, мем-фотографию.]", фото:""},
    {заголовок:"[Та самая история]", цитата:"[Фраза или смешной момент]", продолжение:"[Раскройте историю для неё.]", фото:""},
    {заголовок:"[Секретное прозвище]", цитата:"[Прозвище, понятное только вам]", продолжение:"[Расскажите, откуда оно взялось.]", фото:""}
  ],
  качества: [
    {название:"[Твоя особенность]", объяснение:"[Расскажите, почему эта черта дорога вам и как она проявляется в жизни.]"},
    {название:"[То, как ты умеешь...]", объяснение:"[Один живой пример будет теплее любого общего комплимента.]"},
    {название:"[Маленькая привычка]", объяснение:"[Что в ней вы замечаете и цените?]"},
    {название:"[Твоя смелость / забота / юмор]", объяснение:"[Опишите конкретный момент.]"},
    {название:"[То, что есть только в тебе]", объяснение:"[Добавьте своё личное объяснение.]"},
    {название:"[И ещё одна любимая черта]", объяснение:"[Можно заменить карточку или удалить её.]"}
  ],
  временнаяЛиния: [
    {дата:"[дата]", название:"[Важный момент]", история:"[Одно-два предложения о нём.]", фото:""},
    {дата:"[дата]", название:"[Ещё одна наша веха]", история:"[Почему вам хочется сохранить это в памяти.]", фото:""},
    {дата:"29 октября 2026", название:"Два года вместе", история:"Два года рядом — и мне всё ещё хочется узнавать тебя, выбирать тебя и создавать с тобой новые воспоминания.", фото:""}
  ],
  словаОДвухЛетах: "За это время в нашей истории стало столько маленьких «помнишь?». Я благодарен за каждый день, когда мы были рядом, и за то, что впереди у нас ещё столько всего.",
  вопросы: [
    {текст:"Какой момент из нашей истории тебе хочется пережить ещё раз?", варианты:["[Ваше общее воспоминание]","[Ещё один вариант]","Просто сегодняшний вечер"]},
    {текст:"Что бы ты выбрала для нашего следующего маленького приключения?", варианты:["[Место или занятие]","[Другой вариант]","Пусть решит настроение"]}
  ],
  сюрприз: "[Добавьте ещё одну тёплую историю или короткое сообщение-сюрприз.]",
  письмо: "[Напишите здесь своё полноценное письмо. Лучше всего — своими словами: за что вы благодарны, что особенно любите в вашей истории и чего ждёте впереди. Абзацы разделяйте пустой строкой.]\n\nЯ рядом. И очень тебя люблю.",
  подписьПисьма: "С любовью, ",
  важнаяФраза: "[Ваша самая важная фраза — та, которую хочется унести с собой.]",
  финальноеФото: "images/photo-08.jpg", // Самая любимая фотография для финала.
  финальноеПослание: "Спасибо, что ты — это ты. С нашей второй годовщиной, любимая. Дальше — наша история.",
  плейсхолдерФото: "Здесь будет ваша фотография"
};

const экран = document.getElementById('viewport');
const шапка = document.getElementById('topbar');
const низ = document.getElementById('bottomNav');
const списокГлав = [{тип:'старт',название:'Начало'}, ...ПОДАРОК.главы.map((название,i)=>({тип:`глава${i+1}`,название}))];
let текущая = 0, индексГалереи = 0;
const ключПрогресса = 'наш-маленький-мир-прогресс-v1';
try { const сохранено=Number(localStorage.getItem(ключПрогресса)); if(Number.isInteger(сохранено)&&сохранено>=0&&сохранено<списокГлав.length)текущая=сохранено; } catch {}
const безопасно = значение => String(значение ?? '').replace(/[&<>"']/g,символ=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[символ]));
function фото(путь,подпись,класс=''){
  const alt=безопасно(подпись||ПОДАРОК.плейсхолдерФото);
  const источник=путь ? `<img src="${безопасно(путь)}" alt="${alt}" loading="lazy" onerror="this.remove();this.parentElement.classList.remove('has-image')">` : '';
  return `<div class="portrait ${класс} ${путь?'has-image':''}">${источник}<div class="portrait-copy"><span aria-hidden="true">✳</span>${alt}</div></div>`;
}
function заголовок(глава,метка,вступление=''){return `<p class="eyebrow">${безопасно(метка)}</p><h2>${безопасно(глава)}</h2>${вступление?`<p class="lead">${безопасно(вступление)}</p>`:''}<div class="rule"></div>`}
function кнопка(текст,действие,класс='button'){return `<button class="${класс}" data-action="${действие}">${текст}</button>`}
function чат(){return `<div class="chat" aria-label="Фрагмент переписки">${ПОДАРОК.начало.переписка.map(сообщение=>`<div class="bubble ${сообщение.кто==='я'?'you':''}"><small>${безопасно(сообщение.кто==='я'?'Я':'Она')} · ${безопасно(сообщение.дата)}</small>${безопасно(сообщение.текст)}</div>`).join('')}</div>`}
function renderСтарт(){return `<section class="screen hero"><div class="hero-mark" aria-hidden="true">✦</div><p class="eyebrow">${безопасно(ПОДАРОК.датаГодовщины)} · наша вторая годовщина</p><h1>${безопасно(ПОДАРОК.название)}</h1><p class="hero-note lead">Для Светочки — о нас, наших моментах и всём, что хочется сохранить.</p><div class="rule"></div><p class="hero-note">${безопасно(ПОДАРОК.вступление)}</p><div class="actions">${кнопка('Начать наше путешествие <span aria-hidden="true">→</span>','next','button primary')}</div><p class="footer-note">Тихое место для нашей истории</p></section>`}
function renderНачало(){const d=ПОДАРОК.начало;return `<section class="screen">${заголовок(ПОДАРОК.главы[0],'Глава 1 · однажды','У любой большой истории есть своё маленькое начало.') }<div class="two-col"><div><p>${безопасно(d.история)}</p><p class="caption">${безопасно(d.подпись)}</p></div>${фото(d.фото,d.подпись,'tall')}</div><h3 style="margin-top:2rem">Пара строк, чтобы вспомнить</h3>${чат()}<div class="actions">${кнопка('Кажется, я помню этот момент','reveal-start','button small')}</div><p class="answer" id="startAnswer" hidden>${безопасно(d.отклик)}</p><div class="actions">${кнопка('К нашим моментам →','next','button primary')}</div></section>`}
function renderГалерея(){const карточки=ПОДАРОК.воспоминания;return `<section class="screen">${заголовок(ПОДАРОК.главы[1],'Глава 2 · альбом','Шесть пустых рамок, в которых скоро появятся ваши «помнишь?»')}<div class="actions">${кнопка('← Предыдущее фото','gallery-prev','button small')}${кнопка('Следующее фото →','gallery-next','button small')}</div><p class="caption" id="galleryCount">1 из ${карточки.length}</p><div class="chapter-grid">${карточки.map((карточка,i)=>`<article class="memory ${i===индексГалереи?'open':''}" data-memory="${i}">${фото(карточка.фото,карточка.подпись)}<div class="card-content"><div class="date">${безопасно(карточка.дата)}</div><h3>${безопасно(карточка.заголовок)}</h3><p class="caption">${безопасно(карточка.подпись)}</p><button class="quiet-link" data-action="memory-toggle" aria-expanded="${i===индексГалереи}">${i===индексГалереи?'Скрыть историю':'Открыть историю'}</button><div class="detail"><div><div class="detail-inner">${безопасно(карточка.история)}</div></div></div></div></article>`).join('')}</div><div class="actions">${кнопка('Дальше — наши приколы →','next','button primary')}</div></section>`}
function renderПриколы(){return `<section class="screen">${заголовок(ПОДАРОК.главы[2],'Глава 3 · только для своих','') }<div class="chapter-grid">${ПОДАРОК.приколы.map((x,i)=>`<article class="joke-card" data-joke="${i}"><div class="card-content"><p class="eyebrow">Секрет № ${i+1}</p><h3>${безопасно(x.заголовок)}</h3><p class="lead">«${безопасно(x.цитата)}»</p>${x.фото?фото(x.фото,x.заголовок):''}<button class="quiet-link" data-action="joke-toggle" aria-expanded="false">Раскрыть продолжение</button><div class="detail"><div><div class="detail-inner">${безопасно(x.продолжение)}</div></div></div></div></article>`).join('')}</div><div class="actions">${кнопка('Дальше — о тебе →','next','button primary')}</div></section>`}
function renderКачества(){return `<section class="screen">${заголовок(ПОДАРОК.главы[3],'Глава 4 · замечаю в тебе','мелочи, которые делают тебя тобой') }<div class="chapter-grid">${ПОДАРОК.качества.map((x,i)=>`<article class="quality-card"><div class="card-content"><p class="eyebrow">Мне дорого</p><h3>${безопасно(x.название)}</h3><button class="quiet-link" data-action="quality-toggle" aria-expanded="false">Почему?</button><div class="detail"><div><div class="detail-inner">${безопасно(x.объяснение)}</div></div></div></div></article>`).join('')}</div><div class="actions">${кнопка('К нашим двум годам →','next','button primary')}</div></section>`}
function длительность(){if(!/^\d{4}-\d\d-\d\d$/.test(ПОДАРОК.датаНачала))return '';const начало=new Date(`${ПОДАРОК.датаНачала}T00:00:00`);if(Number.isNaN(+начало)||начало.toISOString().slice(0,10)!==ПОДАРОК.датаНачала)return '';const сегодня=new Date();const дни=Math.max(0,Math.floor((new Date(сегодня.getFullYear(),сегодня.getMonth(),сегодня.getDate())-начало)/86400000));return `<p class="lead">Это примерно <strong>${дни.toLocaleString('ru-RU')}</strong> дней нашей истории — и каждый год считаем по настоящему календарю.</p>`}
function renderВремя(){return `<section class="screen">${заголовок(ПОДАРОК.главы[4],'Глава 5 · время рядом','') }<div class="note-card"><p class="eyebrow">Наша годовщина</p><h3>2 года вместе</h3>${длительность()}</div><p class="lead" style="margin-top:1.4rem">${безопасно(ПОДАРОК.словаОДвухЛетах)}</p><div class="timeline">${ПОДАРОК.временнаяЛиния.map(x=>`<article class="moment"><div class="date">${безопасно(x.дата)}</div><h3>${безопасно(x.название)}</h3><p>${безопасно(x.история)}</p>${x.фото?`<div class="timeline-photo">${фото(x.фото,x.название)}</div>`:''}</article>`).join('')}</div><div class="actions">${кнопка('Поиграть с воспоминаниями →','next','button primary')}</div></section>`}
function renderИнтерактив(){return `<section class="screen">${заголовок(ПОДАРОК.главы[5],'Глава 6 · по желанию','') }${ПОДАРОК.вопросы.map((q,i)=>`<div class="question"><h3>${безопасно(q.текст)}</h3><div class="choice-list">${q.варианты.map((v,j)=>`<button class="choice" data-choice="${i}-${j}">${безопасно(v)}</button>`).join('')}</div><p class="answer" id="answer${i}" aria-live="polite"></p></div>`).join('')}<div class="question"><h3>А здесь есть ещё один маленький привет</h3><button class="button small" data-action="surprise">Открыть тёплый момент</button><p class="answer" id="surpriseAnswer" aria-live="polite"></p></div><div class="actions">${кнопка('К письму →','next','button primary')}</div></section>`}
function renderПисьмо(){return `<section class="screen">${заголовок(ПОДАРОК.главы[6],'Глава 7 · несколько личных слов','Тут можно не спешить. Это письмо — для тебя.') }<div class="envelope-wrap"><button class="envelope" id="envelope" data-action="open-letter"><span><span class="sparkle">✦</span><br><strong>Для любимой</strong><br><span class="muted">Нажми, чтобы открыть письмо</span></span></button><div class="letter-copy" id="letterCopy">${безопасно(ПОДАРОК.письмо)}<br><br>${безопасно(ПОДАРОК.подписьПисьма)}${безопасно(ПОДАРОК.моёИмя)}</div></div><div class="actions">${кнопка('Перейти к финалу →','next','button primary')}</div></section>`}
function renderФинал(){return `<section class="screen finale"><p class="eyebrow">${безопасно(ПОДАРОК.датаГодовщины)} · два года вместе</p><div class="sparkle" aria-hidden="true">✦　✧　✦</div><h2>И это ещё не конец</h2><p class="lead">${безопасно(ПОДАРОК.важнаяФраза)}</p>${фото(ПОДАРОК.финальноеФото,ПОДАРОК.плейсхолдерФото)}<p class="lead">${безопасно(ПОДАРОК.финальноеПослание)}</p><div class="rule" style="margin-left:auto;margin-right:auto"></div><p class="serif">С нашей второй годовщиной, ${безопасно(ПОДАРОК.имяДевушки)}.</p><div class="actions" style="justify-content:center">${кнопка('Пройти наше путешествие ещё раз','restart','button primary')}</div><button class="quiet-link" data-action="home">Вернуться в начало</button></section>`}
const рендеры=[renderСтарт,renderНачало,renderГалерея,renderПриколы,renderКачества,renderВремя,renderИнтерактив,renderПисьмо,renderФинал];
function показать(номер,сохранять=true){текущая=Math.max(0,Math.min(номер,списокГлав.length-1));экран.innerHTML=рендеры[текущая]();const начал=текущая===0;шапка.hidden=начал;низ.hidden=начал;document.getElementById('progressBar').style.width=`${текущая/(списокГлав.length-1)*100}%`;document.getElementById('progressLabel').textContent=`${текущая} / ${списокГлав.length-1}`;document.getElementById('prevButton').disabled=текущая<=0;document.getElementById('nextButton').disabled=текущая>=списокГлав.length-1;document.getElementById('nextButton').style.opacity=текущая>=списокГлав.length-1?'.25':'1';if(сохранять)try{localStorage.setItem(ключПрогресса,String(текущая))}catch{}window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
function toast(текст){const элемент=document.getElementById('toast');элемент.textContent=текст;элемент.classList.add('show');clearTimeout(toast.таймер);toast.таймер=setTimeout(()=>элемент.classList.remove('show'),2600)}
экран.addEventListener('click',событие=>{const действие=событие.target.closest('[data-action]')?.dataset.action;if(действие==='next')показать(текущая+1);if(действие==='prev')показать(текущая-1);if(действие==='home')показать(0);if(действие==='restart'){индексГалереи=0;показать(0)}if(действие==='reveal-start'){const ответ=document.getElementById('startAnswer');ответ.hidden=false;ответ.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350});событие.target.disabled=true}
  if(действие==='memory-toggle'){const article=событие.target.closest('.memory');article.classList.toggle('open');событие.target.setAttribute('aria-expanded',article.classList.contains('open'));событие.target.textContent=article.classList.contains('open')?'Скрыть историю':'Открыть историю'}
  if(действие==='gallery-next'||действие==='gallery-prev'){const cards=[...экран.querySelectorAll('.memory')];индексГалереи=(индексГалереи+(действие==='gallery-next'?1:-1)+cards.length)%cards.length;cards.forEach((c,i)=>{c.classList.toggle('open',i===индексГалереи);const b=c.querySelector('[data-action="memory-toggle"]');b.setAttribute('aria-expanded',i===индексГалереи);b.textContent=i===индексГалереи?'Скрыть историю':'Открыть историю'});cards[индексГалереи].scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('galleryCount').textContent=`${индексГалереи+1} из ${cards.length}`}
  if(действие==='joke-toggle'||действие==='quality-toggle'){const article=событие.target.closest('article');article.classList.toggle('open');событие.target.setAttribute('aria-expanded',article.classList.contains('open'));событие.target.textContent=article.classList.contains('open')?'Свернуть':'Раскрыть продолжение'}
  if(действие==='open-letter'){const envelope=document.getElementById('envelope');envelope.classList.add('open');envelope.disabled=true;envelope.querySelector('.muted').textContent='Пусть эти слова останутся с тобой';setTimeout(()=>document.getElementById('letterCopy').classList.add('show'),250)}
  if(действие==='surprise'){document.getElementById('surpriseAnswer').textContent=ПОДАРОК.сюрприз;событие.target.disabled=true}
  if(действие==='chapters'){const выбор=prompt('К какой главе перейти? Введи номер от 1 до 8.\n\n'+ПОДАРОК.главы.map((x,i)=>`${i+1}. ${x}`).join('\n'));if(выбор!==null){const n=Number(выбор);if(Number.isInteger(n)&&n>=1&&n<=8)показать(n);else toast('Введи номер главы от 1 до 8.')}}
});
экран.addEventListener('click',событие=>{const выбор=событие.target.closest('[data-choice]');if(!выбор)return;const [вопрос]=выбор.dataset.choice.split('-');экран.querySelectorAll(`[data-choice^="${вопрос}-"]`).forEach(к=>к.classList.remove('selected'));выбор.classList.add('selected');const ответ=document.getElementById(`answer${вопрос}`);ответ.textContent='Хороший выбор. Пусть этот момент останется с нами.';try{sessionStorage.setItem(`ответ-${вопрос}`,выбор.dataset.choice)}catch{}});
document.getElementById('prevButton').addEventListener('click',()=>показать(текущая-1));document.getElementById('nextButton').addEventListener('click',()=>показать(текущая+1));document.getElementById('chaptersButton').addEventListener('click',()=>{const выбор=prompt('К какой главе перейти? Введи номер от 1 до 8.\n\n'+ПОДАРОК.главы.map((x,i)=>`${i+1}. ${x}`).join('\n'));if(выбор!==null){const n=Number(выбор);if(Number.isInteger(n)&&n>=1&&n<=8)показать(n);else toast('Введи номер главы от 1 до 8.')}});
показать(текущая,false);
</script>
</body>
</html>
